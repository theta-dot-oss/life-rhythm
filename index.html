<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だいちゃーじ！生活リズム</title>
<meta name="description" content="研究・休憩・運動のリズムをペンギンが案内する常駐アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#cfe7f5">
<style>
:root{
  --bg:#cfe7f5; --card:#eef7fc; --fg:#1d2a3a; --muted:#5f7387; --line:#bfdbeb;
  --accent:#2f8fd6; --accent-fg:#ffffff; --soft:#d9edf9; --warn:#d99a2b; --ok:#3a9a65;
  --bubble:#ffffff; --shadow:0 6px 24px rgba(30,50,80,.12);
  --pg-body:#9dd7f3; --pg-face:#ffffff; --pg-beak:#cfe9fa; --pg-line:#1f2733; --pg-feet:#b9e0f5; --pg-heart:#f38fb6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161e; --card:#18222d; --fg:#e7eef5; --muted:#93a4b7; --line:#273441;
    --accent:#58a9e6; --accent-fg:#0d1621; --soft:#1f3140; --warn:#e6b35a; --ok:#5cc38a;
    --bubble:#1f2b38; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f161e; --card:#18222d; --fg:#e7eef5; --muted:#93a4b7; --line:#273441;
  --accent:#58a9e6; --accent-fg:#0d1621; --soft:#1f3140; --warn:#e6b35a; --ok:#5cc38a;
  --bubble:#1f2b38; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px}
body.pip{padding:0;align-items:stretch}
#app{width:100%;max-width:320px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
body.pip #app{max-width:none;border-radius:0;border:0;box-shadow:none;min-height:100%}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.clock{font-size:22px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.dow{font-size:12px;color:var(--muted);margin-top:4px}
.spacer{flex:1}
.ibtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.ibtn:hover{background:var(--soft);color:var(--fg)}
.stage{display:flex;gap:10px;padding:8px 12px 0;align-items:flex-start}
.pg{width:104px;height:104px;flex:0 0 auto;position:relative}
.pg svg{width:100%;height:100%;overflow:visible}
.pg .imgwrap{display:none;width:100%;height:100%}
.pg .imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.pg.custom svg{display:none}
.pg.custom .imgwrap{display:block}
.imgpanel input[type=file]{width:100%;font-size:12px;margin:6px 0}
.imgrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.imgrow{gap:5px}
.imgrow img{width:40px;height:40px;object-fit:contain;background:var(--soft);border-radius:8px;flex:0 0 auto}
.imgrow select,.imgpanel select{flex:1;min-width:0;font-size:12px;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.imgrow .ibtn{width:24px;height:24px;font-size:12px;flex:0 0 auto}
.imgrow .ibtn[disabled]{opacity:.3}
.imgrow .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.imgrow .sub{display:flex;gap:6px;align-items:center}
.imgrow input{font-size:12px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0;width:100%;box-sizing:border-box}
.info{flex:1;min-width:0;padding-top:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.badge.working{background:var(--soft)}
.badge.break,.badge.longbreak{background:#e8f6ee;color:var(--ok)}
:root[data-theme="dark"] .badge.break,:root[data-theme="dark"] .badge.longbreak{background:#1c3328}
.badge.exercise{background:#fff1dc;color:#b7741a}
:root[data-theme="dark"] .badge.exercise{background:#3a2d17;color:var(--warn)}
.cur{margin-top:6px;font-size:13px;color:var(--muted)}
.cur b{color:var(--fg);font-weight:600}
.elapsed{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.elapsed small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.bubble{margin:8px 12px 0;background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;position:relative;min-height:38px}
.bubble:before{content:"";position:absolute;left:38px;top:-7px;width:12px;height:12px;background:var(--bubble);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.next{margin:8px 12px 0;font-size:13px}
.next .main{font-weight:600}
.next .sub{color:var(--muted);font-size:12px;margin-top:2px}
.next .cal{color:var(--muted);font-size:12px;margin-top:2px}
.next .cal span{color:var(--fg)}
.bar{margin:8px 12px 0;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .5s linear}
.bar.over i{background:var(--warn)}
.actions{display:flex;gap:8px;padding:10px 12px 12px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 12px;font-size:15px;font-weight:700;cursor:pointer;flex:1;
  background:var(--accent);color:var(--accent-fg);letter-spacing:.3px}
.btn:active{transform:translateY(1px)}
.btn.sec{flex:0 0 auto;background:var(--soft);color:var(--accent);font-size:13px;font-weight:600}
.btn.end{background:#e8f6ee;color:var(--ok)}
:root[data-theme="dark"] .btn.end{background:#1c3328}
.hint{font-size:11px;color:var(--muted);padding:0 12px 10px;display:none}
.hint.show{display:block}
.hint button{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;font-size:11px;padding:0;text-decoration:underline}
.flash{position:absolute;inset:0;pointer-events:none;background:var(--accent);opacity:0;}
.flash.on{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
/* panels */
.panel{position:absolute;inset:0;background:var(--card);display:none;flex-direction:column;z-index:5}
.panel.show{display:flex}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.panel .body{padding:10px 12px;overflow:auto;flex:1;font-size:13px}
.panel .body h4{margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.panel .body h4:first-child{margin-top:0}
.menu button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;color:var(--fg);padding:9px 6px;font-size:14px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu button small{color:var(--muted);font-size:11px;margin-left:6px}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.tasks label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
.tasks input{margin-top:3px}
.tasks .done{color:var(--muted);text-decoration:line-through}
.ev{display:flex;gap:8px;padding:3px 0}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:86px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.stat div{background:var(--soft);border-radius:10px;padding:8px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
table.tt{width:100%;border-collapse:collapse;font-size:12px}
table.tt td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.tt td:first-child{color:var(--muted);font-variant-numeric:tabular-nums;width:48px}
.fixed{color:#b7741a;font-weight:600}
.friend{position:absolute;right:-70px;top:120px;width:52px;height:52px;transition:right .6s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;z-index:2}
.friend.show{right:10px}
.friend svg{width:100%;height:100%;overflow:visible}

/* ---------- penguin animation ---------- */
.pg .fl,.pg .fr{transform-box:fill-box;transform-origin:top center}
.pg .zz,.pg .laptop,.pg .eyes-sleep,.pg .eyes-happy,.pg .notes,.pg .sweat,.pg .bottle{display:none}
.pg .whole{transform-box:fill-box;transform-origin:bottom center}
.pose-idle .whole{animation:bob 3s ease-in-out infinite}
.pose-idle .fl{animation:waveL 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.pose-work .laptop{display:block}
.pose-work .fl{animation:typeL .5s steps(2) infinite}
.pose-work .fr{animation:typeR .5s steps(2) infinite .25s}
@keyframes typeL{0%{transform:rotate(-40deg) translateY(0)}100%{transform:rotate(-40deg) translateY(2px)}}
@keyframes typeR{0%{transform:rotate(40deg) translateY(0)}100%{transform:rotate(40deg) translateY(2px)}}
.pose-break .whole{animation:sway 2.4s ease-in-out infinite}
.pose-break .fl{animation:stretchL 2.4s ease-in-out infinite}
.pose-break .fr{animation:stretchR 2.4s ease-in-out infinite}
.pose-break .notes{display:block;animation:floatUp 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes stretchL{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-160deg)}}
@keyframes stretchR{0%,100%{transform:rotate(30deg)}50%{transform:rotate(160deg)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(4px)}30%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.pose-ex .whole{animation:jump .7s ease-in-out infinite}
.pose-ex .fl{animation:pumpL .7s ease-in-out infinite}
.pose-ex .fr{animation:pumpR .7s ease-in-out infinite}
.pose-ex .sweat{display:block;animation:floatUp 1.4s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-10px) scaleY(1.03)}}
@keyframes pumpL{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-150deg)}}
@keyframes pumpR{0%,100%{transform:rotate(20deg)}50%{transform:rotate(150deg)}}
.pose-sleep .whole{animation:breathe 4s ease-in-out infinite}
.pose-sleep .eyes-open{display:none}
.pose-sleep .eyes-sleep,.pose-sleep .zz{display:block}
.pose-sleep .zz{animation:floatUp 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
.pose-happy .whole{animation:hop 1s ease-in-out infinite}
.pose-happy .eyes-open{display:none}
.pose-happy .eyes-happy{display:block}
.pose-happy .notes{display:block;animation:floatUp 1.6s ease-in-out infinite}
.pose-happy .fl{animation:waveL 1s ease-in-out infinite}
.pose-happy .fr{animation:waveR 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.pose-prep .bottle{display:block}
.pose-prep .whole{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pg *{animation:none !important}}
</style>
</head>
<body>
<div id="app">
  <div class="flash" id="flash"></div>
  <div class="top">
    <div><div class="clock" id="clock">--:--</div></div>
    <div class="dow" id="dow"></div>
    <div class="spacer"></div>
    <button class="ibtn" id="btnPip" title="小窓で常に最前面に表示">⧉</button>
    <button class="ibtn" id="btnMenu" title="メニュー">⋯</button>
  </div>
  <div class="stage">
    <div class="pg pose-idle" id="pg">
      <div class="imgwrap whole"><img id="customImg" alt="キャラクター"></div>
      <svg viewBox="0 0 120 120" aria-label="青いペンギン">
        <g class="whole">
          <!-- feet -->
          <ellipse cx="45" cy="111" rx="13" ry="5.5" fill="var(--pg-feet)" stroke="var(--pg-line)" stroke-width="2.4"/>
          <ellipse cx="75" cy="111" rx="13" ry="5.5" fill="var(--pg-feet)" stroke="var(--pg-line)" stroke-width="2.4"/>
          <!-- body: one light-blue egg, big round head -->
          <path d="M60 6 C 26 6, 12 34, 13 62 C 14 92, 32 112, 60 112 C 88 112, 106 92, 107 62 C 108 34, 94 6, 60 6 Z" fill="var(--pg-body)" stroke="var(--pg-line)" stroke-width="3"/>
          <!-- white front: face and belly in one piece; the blue hood comes down to a point between the eyes -->
          <path d="M60 52 C 55 40, 44 32, 35 40 C 26 48, 26 66, 29 86 C 32 102, 44 110, 60 110 C 76 110, 88 102, 91 86 C 94 66, 94 48, 85 40 C 76 32, 65 40, 60 52 Z" fill="var(--pg-face)"/>
          <!-- flippers -->
          <g class="fl"><path d="M22 62 C 8 68, 2 88, 12 96 C 22 100, 30 88, 32 72 Z" fill="var(--pg-body)" stroke="var(--pg-line)" stroke-width="3"/></g>
          <g class="fr"><path d="M98 62 C 112 68, 118 88, 108 96 C 98 100, 90 88, 88 72 Z" fill="var(--pg-body)" stroke="var(--pg-line)" stroke-width="3"/></g>
          <!-- eyes -->
          <g class="eyes-open">
            <ellipse cx="46" cy="58" rx="3.2" ry="4.6" fill="var(--pg-line)"/>
            <ellipse cx="74" cy="58" rx="3.2" ry="4.6" fill="var(--pg-line)"/>
            <circle cx="47.2" cy="56.2" r="1" fill="#fff"/>
            <circle cx="75.2" cy="56.2" r="1" fill="#fff"/>
          </g>
          <g class="eyes-sleep" stroke="var(--pg-line)" stroke-width="2.6" stroke-linecap="round" fill="none">
            <path d="M41 59 q5 3 10 0"/><path d="M69 59 q5 3 10 0"/>
          </g>
          <g class="eyes-happy" fill="var(--pg-heart)" stroke="var(--pg-line)" stroke-width="1.6" stroke-linejoin="round">
            <path d="M46 63 C 40 58, 39 52, 43 51 C 45 50.5, 46 52, 46 53 C 46 52, 47 50.5, 49 51 C 53 52, 52 58, 46 63 Z"/>
            <path d="M74 63 C 68 58, 67 52, 71 51 C 73 50.5, 74 52, 74 53 C 74 52, 75 50.5, 77 51 C 81 52, 80 58, 74 63 Z"/>
          </g>
          <!-- beak: light-blue diamond with a closed-mouth line -->
          <path d="M60 60 L 69 67.5 L 60 75 L 51 67.5 Z" fill="var(--pg-beak)" stroke="var(--pg-line)" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M52.5 67.5 L 67.5 67.5" stroke="var(--pg-line)" stroke-width="1.8" stroke-linecap="round"/>
          <!-- props -->
          <g class="laptop">
            <rect x="30" y="98" width="60" height="6" rx="2" fill="#9aa9b8" stroke="var(--pg-line)" stroke-width="2"/>
            <rect x="34" y="78" width="52" height="22" rx="3" fill="#34495e" stroke="var(--pg-line)" stroke-width="2"/>
            <rect x="38" y="82" width="44" height="14" rx="1.5" fill="#cfe9fb"/>
          </g>
          <g class="bottle">
            <rect x="106" y="84" width="10" height="22" rx="3" fill="#cfe9fb" stroke="var(--pg-line)" stroke-width="2"/>
            <rect x="108" y="78" width="6" height="7" rx="1.5" fill="#3f9bdc" stroke="var(--pg-line)" stroke-width="2"/>
          </g>
        </g>
        <g class="zz" fill="var(--pg-line)" font-weight="700" font-family="system-ui,sans-serif">
          <text x="100" y="20" font-size="14">z</text><text x="110" y="10" font-size="10">z</text>
        </g>
        <g class="notes" fill="var(--accent)" font-family="system-ui,sans-serif">
          <text x="100" y="26" font-size="16">♪</text><text x="112" y="14" font-size="12">♫</text>
        </g>
        <g class="sweat" fill="#58a9e6">
          <path d="M106 26 c-3 5 -3 8 0 8 c3 0 3 -3 0 -8z"/><path d="M114 18 c-2 4 -2 6 0 6 c2 0 2 -2 0 -6z"/>
        </g>
      </svg>
    </div>
    <div class="info">
      <span class="badge" id="badge">待機中</span>
      <div class="cur">現在：<b id="cur">—</b></div>
      <div class="elapsed" id="elapsed"><span id="elapsedVal">00:00</span><small id="elapsedLabel"></small></div>
    </div>
  </div>
  <div class="bubble" id="bubble">…</div>
  <div class="next">
    <div class="main" id="nextMain"></div>
    <div class="sub" id="nextSub"></div>
    <div class="cal" id="nextCal"></div>
  </div>
  <div class="bar" id="bar"><i></i></div>
  <div class="actions" id="actions"></div>
  <div class="hint" id="hint"></div>
  <div class="friend" id="friend"></div>

  <!-- menu panel -->
  <div class="panel" id="menuPanel">
    <header><span>メニュー</span><span class="spacer"></span><button class="ibtn" data-close>✕</button></header>
    <div class="body menu" id="menuBody"></div>
  </div>
  <!-- list panel -->
  <div class="panel" id="listPanel">
    <header><span id="listTitle">今日のリスト</span><span class="spacer"></span><button class="ibtn" data-close>✕</button></header>
    <div class="body" id="listBody"></div>
  </div>
  <!-- summary panel -->
  <div class="panel" id="sumPanel">
    <header><span>今日のまとめ</span><span class="spacer"></span><button class="ibtn" data-close>✕</button></header>
    <div class="body" id="sumBody"></div>
  </div>
  <!-- character image panel -->
  <div class="panel" id="imgPanel">
    <header><span>キャラクターの画像</span><span class="spacer"></span><button class="ibtn" data-close>✕</button></header>
    <div class="body imgpanel" id="imgBody"></div>
  </div>
  <!-- settings panel -->
  <div class="panel" id="setPanel">
    <header><span>設定（表示のみ）</span><span class="spacer"></span><button class="ibtn" data-close>✕</button></header>
    <div class="body" id="setBody"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const LS = 'lr_state_v1', LS_THEME = 'lr_theme', LS_HIST = 'lr_history_v1', LS_IMG = 'lr_char_img';
const pad = n => String(n).padStart(2, '0');
const fmtClock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDur = ms => { ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const fmtMin = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? m % 60 + '分' : ''}` : `${m}分`; };
const pick = (arr, avoid) => { if (!arr || !arr.length) return ''; if (arr.length === 1) return arr[0]; let x; do { x = arr[Math.floor(Math.random() * arr.length)]; } while (x === avoid); return x; };
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

let CFG = null, TODAY = null, S = null;
let root = document, pipWin = null, audioCtx = null, swReg = null;

/* ---------- defaults (used if config.json cannot be loaded) ---------- */
const DEFAULT_CFG = { work_minutes: 50, break_minutes: 5, extend_minutes: 10, renotify_minutes: 4, renotify_max: 2, exercise_window_minutes: 60,
  calendar_notice_minutes: 10, calendar_conflict_max_hours: 3, day_boundary_hour: 5, sound: true, cameo_chance: .25, milk_chance: .25,
  timetable: [{ time: '17:15', label: '運動', kind: 'exercise', fixed: true }], exercise: {}, character: { name: 'ペンギン', catchphrase: 'だいちゃーじ！' },
  lines: {}, break_suggestions: [{ type: 'move', text: '立ち上がって肩を回そう。' }] };

/* ---------- time helpers ---------- */
function dayKey(ts) { const d = new Date(ts - (CFG.day_boundary_hour || 0) * 3600000); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayDate(ts) { const d = new Date(ts - (CFG.day_boundary_hour || 0) * 3600000); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function atTime(base, hhmm, dayOffset = 0) { if (!hhmm) return null; const [h, m] = hhmm.split(':').map(Number); const d = new Date(base); d.setDate(d.getDate() + dayOffset); d.setHours(h, m, 0, 0); return d.getTime(); }
// "logical day" entries: times before boundary hour belong to the next calendar date
function entryTs(base, hhmm) { const [h] = hhmm.split(':').map(Number); return atTime(base, hhmm, h < (CFG.day_boundary_hour || 0) ? 1 : 0); }

/* ---------- state ---------- */
function freshState(now) {
  return { day: dayKey(now), mode: 'idle', since: now, target: null, pausedAt: null, pausedTotal: 0, extended: 0, muteUntil: 0,
    started: false, startedAt: null, endedAt: null, exerciseDone: false, exerciseSkipped: false, exerciseStartedAt: null, suggestion: '', cameo: null,
    log: [], notified: {}, tasksDone: [], line: '' };
}
function load() { try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.day) return s; } catch (e) { } return null; }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }

/* ---------- exercise of the day ---------- */
function exerciseToday(now) {

// make the white / light-gray area connected to the image border transparent (drop shadows included); white inside the character stays
function clearOuterWhite(g, w, h) {
  const img = g.getImageData(0, 0, w, h), d = img.data, seen = new Uint8Array(w * h), q = [];

  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); } for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (q.length) { const i = q.pop(), x = i % w, y = (i - x) / w; d[i * 4 + 3] = 0; if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y); if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1); }

function showImagePanel() {
  const b = $('#imgBody', root);
  const tagSel = (sel, attr) => `<select ${attr}>${Object.entries(TAGS).map(([k, v]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

  const SPEEDS = [['', `設定どおり（${fps}コマ/秒）`], ['0.5', 'とてもゆっくり（2秒に1コマ）'], ['1', 'ゆっくり（1コマ/秒）'], ['2', 'ふつう（2コマ/秒）'], ['4', 'はやい（4コマ/秒）'], ['8', 'とても速い（8コマ/秒）']];

  let lastTag = 'any'; try { lastTag = localStorage.getItem('lr_img_tag') || 'any'; } catch (e) { }
  b.innerHTML = `<div class="muted" style="margin-bottom:6px">シート1枚（または画像1枚）が1本のアニメになります。同じ状態に何本かあるときは、1本を${hold}分ほどループしてから次の1本にランダムで切り替えます（1秒に${fps}コマ。設定 image_fps / image_switch_minutes）。画像はこのブラウザの中にだけ保存され、どこにもアップロードされません。</div>
    <input type="file" id="imgFile" accept="image/*" multiple>
    <label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" id="imgSheet" checked> スプライトシートとして切り分ける（1枚に複数コマ）</label>
    <label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" id="imgWhite" checked> 外側の白い背景を透明にする</label>

    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sec" id="imgBuiltin" style="flex:1">同梱のアニメを入れる</button>${SETS.length ? `<button class="btn sec" id="imgReset" style="flex:1">すべて削除して描いたペンギンに戻す</button>` : ''}</div>
    <div class="muted" style="margin-top:8px;font-size:11px">「いつでも」のアニメはどの状態でも使われ、状態を指定したアニメはその状態のときに優先されます。名前と状態はあとから変えられます。</div>`;
  $('#imgTag', root).onchange = ev => { try { localStorage.setItem('lr_img_tag', ev.target.value); } catch (e) { } };
  $('#imgFile', root).onchange = ev => {

    const add = fr => { frames += fr.length; const name = TAGS[tag] + (SETS.filter(s => s.tag === tag).length + 1); saveSet({ id: newId(), name, tag, frames: fr, at: Date.now() }).then(ok => { ok ? done++ : failed++; finish(); }); };

    row.querySelector('[data-fps]').onchange = ev => { s.fps = +ev.target.value || null; play.startedAt = Date.now(); saveSet(s); };
    row.querySelector('[data-pp]').onchange = ev => { s.pp = ev.target.checked; saveSet(s); };
    row.querySelector('[data-del]').onclick = () => { if (!(root.defaultView || window).confirm(`「${s.name}」を削除する？`)) return; deleteSet(id).then(() => { applyCustomImage(true); showImagePanel(); }); };
  });
  const r = $('#imgReset', root); if (r) r.onclick = async () => { if (!(root.defaultView || window).confirm('登録したアニメをすべて削除する？')) return; for (const s of [...SETS]) await deleteSet(s.id); applyCustomImage(true); showImagePanel(); say('描いたペンギンに戻したよ。'); };
  $('#imgBuiltin', root).onclick = async () => { say('同梱のアニメを読み込み中…'); const n = await loadBuiltinSets(true); showImagePanel(); say(n ? `同梱のアニメ ${n}本が使えるよ！だいちゃーじ！` : 'まだ同梱のアニメは無いみたい。'); };
  openPanel('imgPanel');
}
function saveHistory() {

}

/* ---------- picture-in-picture (always on top) ---------- */
async function openPip() {
  if (!('documentPictureInPicture' in window)) {
    say('このブラウザは小窓（常に最前面）に未対応。Edge/Chrome 116以降で使えるよ。代わりに「アプリとしてインストール」して小さなウィンドウにしてね。'); return;
  }
  if (pipWin) { pipWin.focus(); return; }
  try {
    pipWin = await documentPictureInPicture.requestWindow({ width: 320, height: 430 });
  } catch (e) { say('小窓を開けなかったよ。もう一度ボタンを押してみてね。'); return; }

  doc.documentElement.lang = 'ja'; doc.documentElement.dataset.theme = document.documentElement.dataset.theme;
  for (const ss of document.styleSheets) { try { const st = doc.createElement('style'); st.textContent = [...ss.cssRules].map(r => r.cssText).join('\n'); doc.head.appendChild(st); } catch (e) { } }

  root = doc; wire(doc); lastPose = ''; lastLine = ''; render(true); renderHint();
  const host = document.body;
  host.insertAdjacentHTML('beforeend', `<div id="pipNote" style="text-align:center;color:var(--muted);padding:40px 16px;font-size:14px">小窓で表示中だよ。<br>このタブは閉じずに最小化してOK。<br><button id="pipBack" class="btn" style="margin-top:14px;flex:none">ここに戻す</button></div>`);
  $('#pipBack').onclick = () => pipWin && pipWin.close();
  pipWin.addEventListener('pagehide', () => { document.body.append($('#app', doc)); $('#pipNote')?.remove(); root = document; wire(document); pipWin = null; lastPose = ''; lastLine = ''; render(true); renderHint(); });

/* ---------- wiring ---------- */
function wire(doc) {
  const app = $('#app', doc); if (app.dataset.wired === String(doc === document ? 1 : 2)) return;
  app.dataset.wired = doc === document ? 1 : 2;
  app.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t) return;
    const now = Date.now();
    if (t.hasAttribute('data-close')) { closePanels(); return; }
    if (t.id === 'btnMenu') { showMenu(); return; }
    if (t.id === 'btnPip') { openPip(); return; }
    const act = t.dataset.act || t.dataset.m; if (!act) return;
    if (!audioCtx && CFG.sound) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    ensurePermission();
    closePanels();
    switch (act) {
      case 'start': startResearch(now); break;
      case 'break': startBreak(now); break;
      case 'resume': resumeWork(now); break;
      case 'extend': extendWork(now); break;
      case 'exercise': startExercise(now); break;
      case 'exercise_done': endExercise(now); break;
      case 'skip_exercise': skipExercise(now); break;
      case 'pause': togglePause(now); break;
      case 'mute30': if (now < (S.muteUntil || 0)) { S.muteUntil = 0; say('通知を再開するね。'); save(); render(true); } else mute(now, 30); break;
      case 'end': endResearch(now); break;
      case 'summary': showSummary(); break;
      case 'list': showList('今日のリスト'); break;
      case 'settings': showSettings(); break;
      case 'theme': { const cur = document.documentElement.dataset.theme || 'light'; const nx = { light: 'dark', dark: 'auto', auto: 'light' }[cur]; setTheme(nx); break; }
      case 'pip': openPip(); break;
      case 'image': showImagePanel(); break;
      case 'perm': ensurePermission(); say(('Notification' in window) ? ({ granted: '通知はオンだよ！', denied: '通知がブロックされてるみたい。ブラウザの設定で許可してね。', default: '通知の許可を求めたよ。' }[Notification.permission]) : '通知に未対応のブラウザだよ。'); break;
      case 'reset': if (confirm('今日の状態（タイマーと記録）をリセットする？')) { S = freshState(now); save(); render(true); say('リセットしたよ。'); } break;
    }
  });
}
function setTheme(t) { document.documentElement.dataset.theme = t; if (pipWin) pipWin.document.documentElement.dataset.theme = t; try { localStorage.setItem(LS_THEME, t); } catch (e) { } }

/* ---------- boot ---------- */
async function loadJson(path) { try { const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; return await r.json(); } catch (e) { return null; } }
async function refreshData() {
  const c = await loadJson('config.json'); if (c) CFG = { ...DEFAULT_CFG, ...c };
  const t = await loadJson('data/today.json'); if (t) TODAY = t;
}
async function boot() {
  try { setTheme(localStorage.getItem(LS_THEME) || 'light'); } catch (e) { }
  CFG = DEFAULT_CFG;
  await refreshData();
  const now = Date.now();
  S = load(); if (!S || S.day !== dayKey(now)) S = freshState(now);
  save();
  await loadSets();
  wire(document); render(true); renderHint();
  // service worker: only for notification buttons (no caching)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { swReg = await navigator.serviceWorker.register('sw.js'); navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'notification-action') handleAction(e.data.action); }); } catch (e) { swReg = null; }
  }

  setInterval(tick, 1000);
  startFrameTimer();
  setInterval(refreshData, 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); refreshData(); } });
  if ($('#btnPip')) $('#btnPip').style.display = ('documentPictureInPicture' in window) ? '' : 'none';
}
window.__lr = { get S() { return S; }, get CFG() { return CFG; }, get SETS() { return SETS; }, get play() { return play; }, tick, handleAction, exerciseToday, timetableToday };
boot();
